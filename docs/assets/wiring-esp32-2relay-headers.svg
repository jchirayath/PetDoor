  <text x="40" y="424" class="wire">DO  → G25</text>
  <text x="40" y="443" class="wire">VCC → 3V3  (never 5 V)</text>
  <text x="40" y="462" class="wire">GND → GND</text>
  <text x="40" y="481" class="wire">no resistor — note 3</text>
  <path d="M290 424 L348 424 L348 264 L417 264" fill="none" stroke="#E9A23B" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"/>
  <path d="M290 443 L364 443 L364 128 L417 128" fill="none" stroke="#E9A23B" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"/>
  <path d="M290 462 L380 462 L380 145 L492 145 L492 135" fill="none" stroke="#E9A23B" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"/>
  <rect x="842" y="97" width="250" height="80" rx="6" class="box"/>
  <rect x="842" y="97" width="4" height="80" rx="2" fill="#9AA5B1"/>
  <text x="858" y="118" class="ttl" fill="#9AA5B1">Status LED  (optional)</text>
  <text x="858" y="139" class="wire">G23 → [220 Ω] → LED → GND</text>
  <text x="858" y="158" class="wire">resistor REQUIRED — note 1</text>
  <path d="M747 128 L812 128 L842 128" fill="none" stroke="#9AA5B1" stroke-width="2" stroke-linejoin="round"/>
  <text x="24" y="530" class="ttl" fill="#C7D0DA">Do I need a resistor?</text>
  <text x="24" y="552" class="note"><tspan font-weight="700" fill="#C7D0DA">1 — LED and piezo: YES.</tspan> An ESP32 pin is 3.3 V with no current limiting of its own. 220 Ω–1 kΩ for the LED, about 100 Ω for a piezo.</text>
  <text x="24" y="571" class="note">Without one the pin sources well past its 12 mA rating and degrades — slowly, then intermittently, which is the worst way for it to fail.</text>
  <text x="24" y="596" class="note"><tspan font-weight="700" fill="#C7D0DA">2 — Limit switches: NO.</tspan> The firmware enables the ESP32’s internal pull-up and the switch simply shorts the pin to GND.</text>
  <text x="24" y="615" class="note">Over a run longer than a metre or two, add an external 4.7–10 kΩ pull-up to 3V3 at the BOARD end. The internal one is about 45 kΩ, and a long</text>
  <text x="24" y="634" class="note">unshielded wire into a weak pull-up is an aerial; phantom triggers are the symptom.</text>
  <text x="24" y="659" class="note"><tspan font-weight="700" fill="#C7D0DA">3 — Vibration module: NO.</tspan> It is a powered board with its own comparator and pull-up, and it drives the pin itself.</text>
  <rect x="20" y="680" width="1140" height="80" rx="6" fill="#E76F51" opacity="0.07"/>
  <rect x="20" y="680" width="4" height="80" rx="2" fill="#E76F51"/>
  <text x="42" y="704" class="ttl" fill="#E76F51">Check your own board before you wire anything</text>
  <text x="42" y="726" class="note">This map is the pin card for this board family, and relay counts differ across it. On the 8-relay version G32, G25, G27 and G12 drive relays;</text>
  <text x="42" y="745" class="note">on this 2-relay board the relays sit on GPIO 16 and 17 and those four pins are free. Meter them before you trust either statement.</text>
</svg>
