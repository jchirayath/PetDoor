  <text x="24" y="597" class="ttl" fill="#C7D0DA">Do I need a separate GND pin for each?</text>
  <text x="24" y="618" class="note">No. There are four GND pads — two on each header — and all four are the same net. Here the piezo and the vibration module share one</text>
  <text x="24" y="637" class="note">return, and the two reed switches share another, so two wires reach the board instead of four. The dots mark where they join.</text>
  <text x="24" y="660" class="note">You would have to join them somewhere in any case: a 0.1 inch pin takes ONE Dupont connector. A crimped splice, a WAGO or a small screw</text>
  <text x="24" y="679" class="note">terminal all do the job. Running every ground to one terminal block and taking a single wire to any GND pad is equally correct.</text>
  <text x="24" y="709" class="ttl" fill="#C7D0DA">Do I need a resistor?</text>
  <text x="24" y="731" class="note"><tspan font-weight="700" fill="#C7D0DA">LED and piezo: YES.</tspan> An ESP32 pin is 3.3 V with no current limiting of its own. 220 Ω–1 kΩ for the LED, about 100 Ω for a piezo.</text>
  <text x="24" y="750" class="note">Without one the pin sources well past its 12 mA rating and degrades — slowly, then intermittently, which is the worst way for it to fail.</text>
  <text x="24" y="775" class="note"><tspan font-weight="700" fill="#C7D0DA">Limit switches: NO.</tspan> The firmware enables the ESP32’s internal pull-up and the reed simply shorts its pin to GND.</text>
  <text x="24" y="794" class="note">Over a run longer than a metre or two, add an external 4.7–10 kΩ pull-up to 3V3 at the BOARD end: the internal one is about 45 kΩ, and a long</text>
  <text x="24" y="813" class="note">unshielded wire into a weak pull-up is an aerial. Phantom triggers are the symptom.</text>
  <text x="24" y="838" class="note"><tspan font-weight="700" fill="#C7D0DA">Vibration module: NO.</tspan> It is a powered board with its own comparator and pull-up, and it drives the pin itself.</text>
  <rect x="20" y="859" width="1180" height="80" rx="6" fill="#E76F51" opacity="0.07"/>
  <rect x="20" y="859" width="4" height="80" rx="2" fill="#E76F51"/>
  <text x="42" y="883" class="ttl" fill="#E76F51">Check your own board before you wire anything</text>
  <text x="42" y="905" class="note">This map is the pin card for this board family, and relay counts differ across it. On the 8-relay version G32, G25, G27 and G12 drive relays;</text>
  <text x="42" y="924" class="note">on this 2-relay board the relays sit on GPIO 16 and 17 and those four pins are free. Meter them before you trust either statement.</text>
</svg>
