  <text x="888" y="190" class="wire">G23 → [220 Ω] → LED</text>
  <text x="888" y="209" class="wire">LED → GND</text>
  <path d="M872 186 L826 186 L826 128 L751 128" fill="none" stroke="#9AA5B1" stroke-width="2" stroke-linejoin="round"/>
