<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 924" width="1180" height="924"
     role="img" aria-label="Which header pin each wire lands on for the ESP32 2-relay board, and where a resistor is needed: piezo buzzer through 100 ohms to G27, open limit switch to G32, closed limit switch to G33, vibration sensor DO to G25 with VCC to 3V3 and GND to GND, status LED through 220 ohms to G23. Both relays are driven on-board.">
  <title>PetDoor — which header pin each wire goes to</title>
  <style>
    .h1  { font: 600 17px ui-sans-serif,-apple-system,Segoe UI,Roboto,Arial,sans-serif; fill:#8A96A3; }
    .sub { font: 13px ui-sans-serif,-apple-system,Segoe UI,Roboto,Arial,sans-serif; fill:#9AA5B1; }
    .pin { font: 600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#C7D0DA; }
    .hdr { font: 600 10px ui-sans-serif,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
           fill:#8A96A3; letter-spacing:0.09em; }
    .ttl { font: 600 13px ui-sans-serif,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    .wire{ font: 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#9AA5B1; }
    .note{ font: 12px ui-sans-serif,-apple-system,Segoe UI,Roboto,Arial,sans-serif; fill:#9AA5B1; }
    .box { fill:none; stroke:#7A8794; stroke-width:1; opacity:0.45; }
  </style>
  <text x="20" y="30" class="h1">Which header pin each wire goes to</text>
  <text x="20" y="52" class="sub">Pin names are the board’s own. Both relays are driven on-board from GPIO 16 and 17 — there is nothing to wire for those.</text>
