  <rect x="24" y="150" width="266" height="80" rx="6" class="box"/>
  <rect x="24" y="150" width="4" height="80" rx="2" fill="#9B72CF"/>
  <text x="40" y="171" class="ttl" fill="#9B72CF">Piezo buzzer</text>
  <text x="40" y="192" class="wire">G27 → [100 Ω] → piezo → GND</text>
  <text x="40" y="211" class="wire">resistor REQUIRED — note 1</text>
  <path d="M290 190 L300 190 L300 298 L417 298" fill="none" stroke="#9B72CF" stroke-width="2" stroke-linejoin="round"/>
  <rect x="24" y="258" width="266" height="96" rx="6" class="box" stroke-dasharray="5 4"/>
  <rect x="24" y="258" width="4" height="96" rx="2" fill="#E9A23B"/>
  <text x="40" y="279" class="ttl" fill="#E9A23B">Limit switches</text>
  <text x="40" y="300" class="wire">OPEN   → G32, other leg → GND</text>
  <text x="40" y="319" class="wire">CLOSED → G33, other leg → GND</text>
  <text x="40" y="338" class="wire">no resistor — note 2</text>
  <path d="M290 300 L316 300 L316 230 L417 230" fill="none" stroke="#E9A23B" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"/>
  <path d="M290 319 L332 319 L332 247 L492 247 L492 257" fill="none" stroke="#E9A23B" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"/>
  <rect x="24" y="382" width="266" height="114" rx="6" class="box" stroke-dasharray="5 4"/>
  <rect x="24" y="382" width="4" height="114" rx="2" fill="#E9A23B"/>
