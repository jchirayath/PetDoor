<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180"
     role="img" aria-label="PetDoor — proximity pet door controller">
  <title>PetDoor</title>
  <defs>
    <linearGradient id="bframe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A9D8F"/>
      <stop offset="1" stop-color="#21867A"/>
    </linearGradient>
  </defs>

  <g transform="translate(16,14) scale(0.59)">
    <rect x="38" y="26" width="180" height="204" rx="18"
          fill="none" stroke="url(#bframe)" stroke-width="14"/>
    <rect x="64" y="52" width="128" height="152" rx="8" fill="#2A9D8F" opacity="0.10"/>
    <line x1="64" y1="52" x2="64" y2="204" stroke="#2A9D8F" stroke-width="7"
          stroke-linecap="round" opacity="0.55"/>
    <path d="M64 52 L150 74 L150 182 L64 204 Z" fill="#2A9D8F" opacity="0.28"/>
    <path d="M64 52 L150 74 L150 182 L64 204" fill="none" stroke="#2A9D8F"
          stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="30" cy="196" r="12" fill="#E9A23B"/>
    <g fill="none" stroke="#E9A23B" stroke-width="7" stroke-linecap="round">
      <path d="M52 172 a34 34 0 0 1 0 48"/>
      <path d="M70 156 a58 58 0 0 1 0 80" opacity="0.62"/>
      <path d="M88 140 a82 82 0 0 1 0 112" opacity="0.32"/>
    </g>
  </g>

  <text x="178" y="82" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
