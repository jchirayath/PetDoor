<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 200" width="2.5in" height="2in"
     role="img" aria-label="PetDoor label: logo, name and project URL">
  <title>PetDoor label</title>

  <!-- Printable 2.5 x 2 in label. One viewBox unit = 0.01 in, so the numbers
       below are hundredths of an inch. The logo is docs/assets/logo.svg,
       unchanged apart from the transform. Solid colours where logo.svg uses
       low opacity would wash out on a home printer, so the faintest fills are
       nudged up slightly. -->
  <defs>
    <linearGradient id="lframe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A9D8F"/>
      <stop offset="1" stop-color="#21867A"/>
    </linearGradient>
  </defs>

  <!-- paper, with a light cut guide inset from the edge -->
  <rect width="250" height="200" fill="#FFFFFF"/>
  <rect x="4" y="4" width="242" height="192" rx="12" fill="none"
        stroke="#D5DBE0" stroke-width="0.8"/>

  <g transform="translate(94.3,8.3) scale(0.26)">
    <rect x="38" y="26" width="180" height="204" rx="18"
          fill="none" stroke="url(#lframe)" stroke-width="14"/>
    <rect x="64" y="52" width="128" height="152" rx="8" fill="#2A9D8F" opacity="0.14"/>
    <line x1="64" y1="52" x2="64" y2="204" stroke="#2A9D8F" stroke-width="7"
          stroke-linecap="round" opacity="0.55"/>
    <path d="M64 52 L150 74 L150 182 L64 204 Z" fill="#2A9D8F" opacity="0.32"/>
    <path d="M64 52 L150 74 L150 182 L64 204" fill="none" stroke="#2A9D8F"
          stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="30" cy="196" r="12" fill="#E9A23B"/>
    <g fill="none" stroke="#E9A23B" stroke-width="7" stroke-linecap="round">
      <path d="M52 172 a34 34 0 0 1 0 48"/>
      <path d="M70 156 a58 58 0 0 1 0 80" opacity="0.65"/>
      <path d="M88 140 a82 82 0 0 1 0 112" opacity="0.38"/>
    </g>
  </g>

  <text x="125" y="116" text-anchor="middle"
        font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="46" font-weight="700" fill="#21867A">PetDoor</text>
  <text x="125" y="138" text-anchor="middle"
        font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="12" fill="#5B6670">Opens when your pet walks up to it.</text>

  <line x1="55" y1="151" x2="195" y2="151" stroke="#E9A23B" stroke-width="1.2"
        stroke-linecap="round"/>

  <text x="125" y="175" text-anchor="middle"
        font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="13" font-weight="500" fill="#3A444D">github.com/jchirayath/PetDoor</text>
</svg>
