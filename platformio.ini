; PlatformIO build for PetDoor.
;
; Arduino IDE / arduino-cli is the primary supported toolchain — the petdoor/
; folder is a valid Arduino sketch folder, and this file just points
; PlatformIO at the same sources so there is only ever one copy of the code.
;
; This project targets ESP32 Arduino core 3.x. The official `espressif32`
; platform in the PlatformIO registry is pinned to core 2.x, where
; BLEAdvertisedDevice::getManufacturerData() returns std::string instead of
; String and this code will not compile. The pioarduino fork below tracks
; core 3.x.
;
; Pin a specific release tag for reproducible builds:
;   https://github.com/pioarduino/platform-espressif32/releases

[platformio]
src_dir = petdoor

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32dev
framework = arduino
monitor_speed = 115200

; Two 1.9 MB app slots, so firmware can be pushed over WiFi instead of holding
; IO0 and tapping EN. The build sits at ~85% of one slot.
;
; NVS is at the same offset (0x9000) in this layout as in no_ota and the default,
; so switching between them preserves the beacon, thresholds and event log.
board_build.partitions = min_spiffs.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
; Put your beacon in petdoor/secrets.h (git-ignored), or uncomment here:
;   -DBEACON_MAC='"aa:bb:cc:dd:ee:ff"'
