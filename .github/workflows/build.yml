name: build

# Verification is a host test suite plus "it compiles for every target".
#
# The tests came after a bug that compiled perfectly and ran for weeks: the
# NimBLE adapter converted binary advertisement payloads through c_str(), which
# stops at the first NUL — and both frames this firmware parses have a NUL in
# byte 2. Eddystone battery telemetry never decoded and iBeacon UUID matching
# could never match. "It compiles" could not have caught it; one unit test with
# a real payload catches it instantly. See tests/host/README.md.
#
# Checked here:
#
#   1. It builds unconfigured (discovery mode), which is how a new user first
#      flashes it.
#   2. It builds for both BLE stacks. NimBLE is the default, so every job needs
#      the NimBLE-Arduino library installed; the classic-ESP32 job opts back
#      out with PETDOOR_USE_NIMBLE=0 to keep Bluedroid compiling. Keeping both
#      alive is a project invariant and it is easy to break on one board
#      without noticing.
#   3. It builds the default stack on the reference board — classic ESP32 with
#      NimBLE — in its own job. The matrix cannot cover it, because that same
#      board is where Bluedroid is exercised.
#
# Both halves of the stack adapter in ble_scanner.cpp must stay compiled. A
# job that silently loses its stack flag would leave one half untested while
# still showing green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Pure-logic tests, no hardware and no Arduino toolchain — so they run first
  # and fail fast. beacon.* parses bytes from any radio in range, which makes it
  # the only attacker-controlled input the firmware has; it is fuzzed under
  # ASan/UBSan here (TEST-10) as well as unit tested.
  host-tests:
    runs-on: ubuntu-latest
    name: host tests (beacon, proximity, sensor verdicts, fuzz, server alerting)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Ubuntu's clang ships the libFuzzer runtime, so CI gets real
      # coverage-guided fuzzing where a Mac falls back to the deterministic
      # driver. run.sh picks whichever is available.
      - name: Install clang (for libFuzzer)
        run: sudo apt-get update -qq && sudo apt-get install -y clang
      - name: Unit tests, fuzz and the BLE-adapter guard
        env:
          CXX: clang++
          FUZZ_SECONDS: 60
        run: tests/host/run.sh
      # The log server's alerting is state-machine logic in dictionaries, and
      # both its failure modes are silent: too eager buries the message that
      # mattered, too shy never mentions the door that stopped reporting.
      - name: Log server alerting rules
        run: tests/server/run.sh

  compile:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Bluedroid is no longer the default, so this job has to ask for it
          # explicitly. Without the flag it would build NimBLE and the older
          # stack would go untested while the job still passed.
          #
          # THIS JOB IS DELIBERATELY NOT A REQUIRED STATUS CHECK on main, unlike
          # the other three compile jobs. It sits at 94% of min_spiffs with about
          # 114 KB spare and has been creeping — 123 KB two features ago — so it
          # will eventually overflow, and when it does it must not block a merge
          # for a configuration nobody runs. It still runs, and a red mark here is
          # still the signal that the day has come.
          #
          # Do not "fix" the asymmetry by adding it back to the required list.
          # The real decision — commit to Bluedroid or delete the stack adapter
          # at the top of ble_scanner.cpp — is recorded in docs/PARKING_LOT.md.
          - fqbn: esp32:esp32:esp32
            name: ESP32 (Bluedroid)
            stackflags: >-
              --build-property compiler.cpp.extra_flags=-DPETDOOR_USE_NIMBLE=0
              --build-property compiler.c.extra_flags=-DPETDOOR_USE_NIMBLE=0
          # Empty: these take the default stack, which is NimBLE.
          - fqbn: esp32:esp32:esp32s3
            name: ESP32-S3 (NimBLE)
            stackflags: ''
          - fqbn: esp32:esp32:esp32c3
            name: ESP32-C3 (NimBLE)
            stackflags: ''

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0

      # NimBLE-Arduino is required even for the Bluedroid job: the matrix shares
      # one install step, and every other entry builds the default stack, which
      # needs the library. ble_scanner.cpp #errors out without it.
      - name: Install ESP32 core 3.x and NimBLE-Arduino
        run: |
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install NimBLE-Arduino@2.5.1
          arduino-cli core list

      # How a new user first flashes it: no secrets.h, no beacon, discovery
      # mode, and the door is never touched.
      - name: Compile unconfigured
        run: arduino-cli compile --fqbn ${{ matrix.fqbn }}:PartitionScheme=min_spiffs ${{ matrix.stackflags }} --warnings default petdoor

      # Exercises the configured path, and the secrets.h include in config.h.
      # secrets.h is git-ignored, so CI has to create one.
      - name: Compile with a beacon configured
        run: |
          cat > petdoor/secrets.h <<'EOF'
          #pragma once
          #define BEACON_MAC       "aa:bb:cc:dd:ee:ff"
          #define RSSI_ENTER_DBM   -60
          #define RSSI_EXIT_DBM    -72
          #define RELAY_ACTIVE_LOW 1
          EOF
          arduino-cli compile --fqbn ${{ matrix.fqbn }}:PartitionScheme=min_spiffs ${{ matrix.stackflags }} --warnings default petdoor
          rm petdoor/secrets.h

      # The static_asserts are load-bearing safety guardrails. Confirm they
      # actually fire, so a refactor cannot quietly disarm them.
      - name: Verify safety static_asserts fire
        run: |
          set +e
          fail=0

          check() {
            local label="$1"
            cat > petdoor/secrets.h
            if arduino-cli compile --fqbn ${{ matrix.fqbn }}:PartitionScheme=min_spiffs ${{ matrix.stackflags }} petdoor >/dev/null 2>&1; then
              echo "::error::$label — expected the build to FAIL, but it succeeded"
              fail=1
            else
              echo "ok: $label correctly refused to compile"
            fi
            rm -f petdoor/secrets.h
          }

          # Invariant 1: no hysteresis band — the door would flap.
          check "inverted RSSI thresholds" <<'EOF'
          #pragma once
          #define BEACON_MAC     "aa:bb:cc:dd:ee:ff"
          #define RSSI_ENTER_DBM -80
          #define RSSI_EXIT_DBM  -60
          EOF

          # Invariant 2: the actuation lockout would delay closing.
          check "lockout longer than exit dwell" <<'EOF'
          #pragma once
          #define BEACON_MAC                "aa:bb:cc:dd:ee:ff"
          #define MIN_ACTUATION_INTERVAL_MS 20000
          #define EXIT_CONFIRM_MS           15000
          EOF

          # An even median window has no single middle element.
          check "even median window" <<'EOF'
          #pragma once
          #define BEACON_MAC         "aa:bb:cc:dd:ee:ff"
          #define RSSI_MEDIAN_WINDOW 8
          EOF

          # Both relays on one pin defeats the interlock entirely.
          check "open and close on the same pin" <<'EOF'
          #pragma once
          #define BEACON_MAC       "aa:bb:cc:dd:ee:ff"
          #define PIN_RELAY_OPEN   16
          #define PIN_RELAY_CLOSE  16
          EOF

          # Invariant 4: the open path must never lag the close path.
          check "open filter slower than close filter" <<'EOF'
          #pragma once
          #define BEACON_MAC         "aa:bb:cc:dd:ee:ff"
          #define RSSI_MEDIAN_WINDOW 3
          #define RSSI_FAST_WINDOW   7
          EOF

          exit $fail

      - name: Report size
        if: always()
        run: |
          arduino-cli compile --fqbn ${{ matrix.fqbn }}:PartitionScheme=min_spiffs ${{ matrix.stackflags }} petdoor 2>&1 | tail -3

  # The default build on the reference hardware: classic ESP32 with NimBLE.
  # This is what a new user gets, so it is the most important job here — but
  # the matrix cannot cover it, because the classic-ESP32 entry there is spoken
  # for by Bluedroid. The flag is redundant with the default in config.h and is
  # passed anyway, so this job keeps testing NimBLE if that default ever moves.
  compile-nimble:
    runs-on: ubuntu-latest
    name: ESP32 (NimBLE, default)

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0

      - name: Install ESP32 core 3.x and NimBLE-Arduino
        run: |
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install NimBLE-Arduino@2.5.1

      # Note compiler.cpp.extra_flags, not build.extra_flags: the latter carries
      # -DCORE_DEBUG_LEVEL, -DESP32 and the loop/event core settings, and
      # overriding it drops them.
      - name: Compile unconfigured
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs \
            --build-property "compiler.cpp.extra_flags=-DPETDOOR_USE_NIMBLE=1" \
            --build-property "compiler.c.extra_flags=-DPETDOOR_USE_NIMBLE=1" \
            --warnings default petdoor

      - name: Compile with a beacon configured
        run: |
          cat > petdoor/secrets.h <<'EOF'
          #pragma once
          #define BEACON_MAC       "aa:bb:cc:dd:ee:ff"
          #define RSSI_ENTER_DBM   -60
          #define RSSI_EXIT_DBM    -72
          #define RELAY_ACTIVE_LOW 1
          EOF
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs \
            --build-property "compiler.cpp.extra_flags=-DPETDOOR_USE_NIMBLE=1" \
            --build-property "compiler.c.extra_flags=-DPETDOOR_USE_NIMBLE=1" \
            --warnings default petdoor
          rm petdoor/secrets.h

      - name: Report size
        if: always()
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs \
            --build-property "compiler.cpp.extra_flags=-DPETDOOR_USE_NIMBLE=1" \
            --build-property "compiler.c.extra_flags=-DPETDOOR_USE_NIMBLE=1" \
            petdoor 2>&1 | tail -3
